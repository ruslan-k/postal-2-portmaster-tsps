Section "ServerLayout"
    Identifier "Postal2"
    Screen 0 "Screen0"
EndSection

Section "Files"
    ModulePath "/tmp/xvfb-postal2/usr/lib/xorg/modules"
EndSection

Section "Module"
    Load "glx"
EndSection

Section "ServerFlags"
    Option "AIGLX" "on"
    Option "AllowIndirectGLX" "on"
    Option "AutoAddDevices" "off"
    Option "AutoEnableDevices" "off"
EndSection

Section "Device"
    Identifier "DummyDevice"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "DummyMonitor"
    HorizSync 30.0-80.0
    VertRefresh 50.0-75.0
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "DummyDevice"
    Monitor "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720"
    EndSubSection
EndSection
